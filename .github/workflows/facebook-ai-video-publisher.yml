name: Facebook AI Video Publisher

on:
  # 10:00, 15:00 and 19:00 Asia/Kolkata (UTC+5:30)
  schedule:
    - cron: "30 4,9,13 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "Optional topic for this video"
        required: false
        type: string
      dry_run:
        description: "Render only; do not publish to Facebook"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: facebook-page-publisher
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: automation/facebook_video/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r automation/facebook_video/requirements.txt

      - name: Generate video and caption
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL }}
          POLLINATIONS_VIDEO_MODEL: ${{ vars.POLLINATIONS_VIDEO_MODEL }}
          POLLINATIONS_TEXT_MODEL: ${{ vars.POLLINATIONS_TEXT_MODEL }}
          CONTENT_THEME: ${{ inputs.theme }}
          VIDEO_OUTPUT: output/facebook-video.mp4
          METADATA_OUTPUT: output/post.json
        run: python automation/facebook_video/generate.py

      - name: Publish to Facebook Page
        if: ${{ !inputs.dry_run }}
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '436135029576334' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: ${{ vars.FACEBOOK_GRAPH_API_VERSION || 'v25.0' }}
          VIDEO_OUTPUT: output/facebook-video.mp4
          METADATA_OUTPUT: output/post.json
        run: python automation/facebook_video/publish.py

      - name: Upload generated video and caption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-video-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
